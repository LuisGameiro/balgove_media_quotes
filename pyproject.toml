[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-quotes"
version = "0.1.0"
description = "Auditable media-quote collection and daily digest system"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]

[project.scripts]
mq = "media_quotes.cli:main"

[project.optional-dependencies]
eval = ["pydantic-evals>=0.1", "ragas>=0.2"]
render = ["jinja2>=3.1"]
dashboard = ["streamlit>=1.35", "pandas>=2.2"]
orchestration = ["dagster>=1.8", "dagster-webserver>=1.8"]
extraction = ["httpx>=0.27", "feedparser>=6.0", "trafilatura>=1.12", "selectolax>=0.3", "playwright>=1.45"]
llm = ["openai>=1.30", "pydantic-ai>=0.1"]

[dependency-groups]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "pytest>=8",
    "pytest-cov>=5",
    "vcrpy>=6",
    "syrupy>=4",
    "jsonschema>=4",
]
test = [{include-group = "lint"}]
dev = [{include-group = "test"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
media_quotes = ["py.typed", "db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=media_quotes"
filterwarnings = ["error"]
markers = [
    "integration: needs a real service (Postgres/feed); opt-in via -m",
    "network: may touch the network; unit tests replay VCR cassettes instead",
    "slow: long-running eval or backfill simulation",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Contract in docs/02 §7. No blanket noqa without a comment.
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest uses plain assert

[tool.ruff.format]
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
show_error_codes = true
warn_unused_configs = true

# Targeted overrides only; untyped third-party libraries.
[[tool.mypy.overrides]]
module = ["jsonschema", "feedparser", "trafilatura", "selectolax"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["media_quotes"]

[tool.coverage.report]
show_missing = true
fail_under = 85
