[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-quotes"
version = "0.1.0"
description = "Auditable media-quote collection and daily digest system"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "jsonschema>=4",
    "defusedxml>=0.7",
    "httpx>=0.27",
]

[project.scripts]
mq = "media_quotes.cli:cli_entry"

[project.optional-dependencies]
dashboard = ["streamlit>=1.35"]
orchestration = ["dagster>=1.8", "dagster-webserver>=1.8"]
extraction = ["trafilatura>=1.12"]
llm = ["openai>=1.30"]
graph = ["neo4j>=5.20"]

[dependency-groups]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
]
test = [
    {include-group = "lint"},
    "pytest>=8",
    "pytest-cov>=5",
]
dev = [
    {include-group = "test"},
    "build>=1.2",
    # Keep the orchestration tooling installed for the common dev sync command.
    "dagster>=1.8",
    "dagster-webserver>=1.8",
]
# Optional: only install when EXTRACTION_FALLBACK=rendered is used.
render = ["playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
media_quotes = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
filterwarnings = [
    "error",
    "ignore:datetime\\.utcnow\\(\\) is deprecated:DeprecationWarning",
    "ignore:datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning",
]
markers = [
    "integration: needs a real service (Postgres/feed); opt-in via -m",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Contract in docs/02 §7. No blanket noqa without a comment.
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest uses plain assert
"scripts/data/generate_gold_fixtures.py" = ["E501"]  # embedded synthetic fixture sentences

[tool.ruff.format]
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
show_error_codes = true
warn_unused_configs = true

# Targeted overrides only; untyped third-party libraries.
[[tool.mypy.overrides]]
module = [
    "jsonschema", "trafilatura", "openai", "defusedxml", "defusedxml.ElementTree", "neo4j",
    "playwright.sync_api", "defusedxml.common",
    # Optional orchestration extra; absent in bare dev environments.
    "dagster",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "media_quotes.orchestration"
disallow_subclassing_any = false
disallow_untyped_decorators = false


[tool.coverage.run]
branch = true
source = ["media_quotes"]

[tool.coverage.report]
show_missing = true
fail_under = 85
